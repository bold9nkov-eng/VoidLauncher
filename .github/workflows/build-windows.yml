name: Build VoidLauncher for Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voidlauncher-windows-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build release
        run: cargo build --release
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: VoidLauncher-Windows
          path: target/release/voidlauncher.exe
          if-no-files-found: error
          retention-days: 14
