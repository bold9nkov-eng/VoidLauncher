[package]
name = "voidlauncher"
version = "0.2.0"
edition = "2021"

[dependencies]
eframe = { version = "0.29", features = ["default_fonts"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
open = "5"
dirs = "6"
mc-launcher-core = "0.1.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_Shell"] }
